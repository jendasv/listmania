# Content Security Policy for the Vue SPA (not /admin — Filament's Livewire/
# Alpine stack needs 'unsafe-eval', so it isn't covered by this policy).
#
# Report-Only for now: violations show in the browser console without
# breaking anything. Once a pass through the app (login, lists, realtime,
# barcode scan, PWA install) shows none, rename the header to
# Content-Security-Policy to enforce it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss://$host; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
