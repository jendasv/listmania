# Included at server level AND in every location that sets its own add_header:
# nginx drops all inherited add_header directives as soon as a location
# declares one, so a location-level Cache-Control would silently strip these.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Camera stays available to our own origin — the barcode scanner needs it.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
